<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="description" content="AR Tags — câmera em tela cheia com rastreamento ao vivo de QR Codes e objetos 3D.">
<title>AR Tags</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}.stage{position:fixed;inset:0;background:#05080d;overflow:hidden}.camera{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;background:#05080d}.three-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42),transparent 22%,transparent 72%,rgba(0,0,0,.42))}.topline{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}.brand,.status{border:1px solid rgba(255,255,255,.18);background:rgba(5,10,18,.58);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;font-size:12px;box-shadow:0 5px 24px #0002}.brand{font-weight:800;letter-spacing:.08em}.status{color:#b9ffe0;max-width:68%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bottomline{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:16px;right:16px;text-align:center;pointer-events:none}.hint{display:inline-block;padding:10px 14px;border-radius:14px;background:rgba(5,10,18,.58);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);font-size:12px;color:#e3eaf4;line-height:1.45}.permission{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(5,8,13,.92);text-align:center}.permission-card{max-width:340px}.permission h1{font-size:22px;margin:0 0 8px}.permission p{color:#b8c3d5;font-size:14px;line-height:1.5;margin:0 0 18px}.permission button{border:0;border-radius:14px;background:#8bffcb;color:#062018;font-size:16px;font-weight:800;padding:14px 20px;width:100%}.hidden{display:none!important}.reticle{position:absolute;left:50%;top:50%;width:72px;height:72px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.35);border-radius:18px;opacity:.5;pointer-events:none}.reticle:before,.reticle:after{content:"";position:absolute;background:#8bffcb;opacity:.9}.reticle:before{width:20px;height:2px;left:25px;top:34px}.reticle:after{height:20px;width:2px;left:34px;top:25px}@media (orientation:landscape){.bottomline{left:auto;width:42%;right:12px;bottom:14px}.topline{left:12px;right:12px}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Leitor de realidade aumentada em tela cheia">
  <video id="camera" class="camera" autoplay muted playsinline></video>
  <canvas id="threeLayer" class="three-layer"></canvas>
  <div class="shade"></div>
  <div class="reticle" id="reticle"></div>
  <div class="topline"><div class="brand">AR TAGS</div><div class="status" id="status" role="status">Iniciando câmera…</div></div>
  <div class="bottomline"><div class="hint" id="hint">Aponte para um QR Code AR-01 a AR-10.<br>O objeto 3D aparecerá sobre o marcador.</div></div>
  <section class="permission hidden" id="permission"><div class="permission-card"><h1>Ative a câmera</h1><p>Para rastrear os QR Codes em tempo real, permita o acesso à câmera. Abra este site por HTTPS no Chrome do Android.</p><button id="startButton">Abrir câmera</button></div></section>
</main>
<script type="module">
const $ = id => document.getElementById(id);
const video = $('camera'), canvas = $('threeLayer');
const COLORS = [0x8bffcb,0x7dd3fc,0xf9a8d4,0xc4b5fd,0xfde68a,0x6ee7b7,0x93c5fd,0xfca5a5,0xa7f3d0,0xd8b4fe];
const models = Array.from({length:10},(_,i)=>({id:i+1,path:`assets/models/object-${String(i+1).padStart(2,'0')}.glb`,color:COLORS[i]}));
let stream=null, detector=null, qrLibrary=null, scanFrame=0, lastSeen=0, currentId=0, currentObject=null, modelCache=new Map(), lastStatus='', THREE=null, GLTFLoader=null, renderer=null, scene=null, camera3d=null, scanning=false;
const scanCanvas=document.createElement('canvas'); const scanCtx=scanCanvas.getContext('2d',{willReadFrequently:true});
function setStatus(s){if(s!==lastStatus){$('status').textContent=s;lastStatus=s}}
function showError(message){$('permission').classList.remove('hidden');$('permission').querySelector('p').textContent=message;setStatus('Câmera indisponível')}
function tagId(raw){const s=String(raw||'').trim();let m=s.match(/(?:AR\s*[-:]?\s*)(0?[1-9]|10)\b/i);if(!m)m=s.match(/(?:^|[/?#=&])(?:AR-?)?(0?[1-9]|10)(?:$|[/?#=&])/i);return m?Number(m[1]):0}
function placeholder(id){const g=new THREE.Group(),color=COLORS[id-1],mat=new THREE.MeshStandardMaterial({color,metalness:.38,roughness:.22,emissive:color,emissiveIntensity:.16});let mesh;switch(id%4){case 1:mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.36,1),mat);break;case 2:mesh=new THREE.Mesh(new THREE.TorusKnotGeometry(.27,.075,100,12),mat);break;case 3:mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.39,0),mat);break;default:mesh=new THREE.Mesh(new THREE.TorusGeometry(.3,.075,16,64),mat)}g.add(mesh);const ring=new THREE.Mesh(new THREE.TorusGeometry(.5,.012,8,64),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));ring.rotation.x=Math.PI/2.6;g.add(ring);const orb=new THREE.Mesh(new THREE.SphereGeometry(.06,20,16),new THREE.MeshBasicMaterial({color:0xffffff}));orb.position.set(.48,.12,0);g.add(orb);g.userData.placeholder=true;return g}
async function loadObject(id){if(modelCache.has(id))return modelCache.get(id).clone(true);let obj;try{const r=await fetch(models[id-1].path,{method:'HEAD'});if(r.ok&&GLTFLoader){const gltf=await new GLTFLoader().loadAsync(models[id-1].path);obj=gltf.scene;const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z)||1;obj.scale.setScalar(.72/max);obj.position.sub(box.getCenter(new THREE.Vector3()));}}catch(e){console.warn('Modelo GLB não carregado:',e)}if(!obj)obj=placeholder(id);modelCache.set(id,obj);return obj.clone(true)}
function screenPoint(box){const vw=video.videoWidth||innerWidth,vh=video.videoHeight||innerHeight,sw=innerWidth,sh=innerHeight,scale=Math.max(sw/vw,sh/vh),shownW=vw*scale,shownH=vh*scale,cropX=(shownW-sw)/2,cropY=(shownH-sh)/2;return{x:(box.x+box.width/2)*scale-cropX,y:box.y*scale-cropY,w:box.width*scale,h:box.height*scale}}
async function showTag(id,box){lastSeen=performance.now();if(id!==currentId){currentId=id;setStatus(`QR AR-${String(id).padStart(2,'0')} detectado`);$('hint').textContent=`Marcador AR-${String(id).padStart(2,'0')} reconhecido. Objeto 3D em realidade aumentada.`;if(THREE&&scene){const next=await loadObject(id);if(id!==currentId)return;if(currentObject)scene.remove(currentObject);currentObject=next;scene.add(currentObject)}}if(currentObject&&box&&camera3d){const p=screenPoint(box),nx=p.x/innerWidth*2-1,ny=1-p.y/innerHeight*2,z=1.35,v=new THREE.Vector3(nx,ny,.5).unproject(camera3d),dir=v.sub(camera3d.position).normalize(),distance=z/Math.max(.1,Math.abs(dir.z)),world=camera3d.position.clone().add(dir.multiplyScalar(distance));world.y+=Math.min(.75,p.h/innerHeight*1.8);currentObject.position.lerp(world,.4);const size=Math.max(.45,Math.min(1.25,p.w/innerWidth*2.8));if(currentObject.userData.placeholder)currentObject.scale.setScalar(size);currentObject.visible=true}}
async function loadQrFallback(){if(window.jsQR){qrLibrary=window.jsQR;return true}return new Promise(resolve=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';s.onload=()=>{qrLibrary=window.jsQR;resolve(!!qrLibrary)};s.onerror=()=>resolve(false);document.head.appendChild(s)})}
async function setup3D(){try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js');try{({GLTFLoader}=await import('https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/loaders/GLTFLoader.js'))}catch(e){console.warn('GLTFLoader indisponível; usando objetos de demonstração',e)}renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x000000,0);renderer.outputColorSpace=THREE.SRGBColorSpace;scene=new THREE.Scene();camera3d=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);camera3d.position.set(0,0,3.2);scene.add(new THREE.HemisphereLight(0xffffff,0x475569,2.2));const keyLight=new THREE.DirectionalLight(0xffffff,2.3);keyLight.position.set(1.5,2.5,3);scene.add(keyLight);requestAnimationFrame(animate);return true}catch(e){console.error(e);setStatus('Câmera ativa · falha ao carregar 3D');$('hint').textContent='A câmera está ativa, mas a biblioteca 3D não carregou. Verifique a internet e recarregue a página.';return false}}
async function decodeFrame(){if(video.readyState<2)return null;if('BarcodeDetector'in window){try{if(!detector)detector=new BarcodeDetector({formats:['qr_code']});const codes=await detector.detect(video);for(const c of codes){const id=tagId(c.rawValue);if(id>=1&&id<=10&&c.boundingBox)return{id,box:{x:c.boundingBox.x,y:c.boundingBox.y,width:c.boundingBox.width,height:c.boundingBox.height}}}}catch(e){console.warn('BarcodeDetector falhou; tentando leitor alternativo',e);detector=null}}
if(!qrLibrary){const ok=await loadQrFallback();if(!ok)return null}scanCanvas.width=Math.min(video.videoWidth,960);scanCanvas.height=Math.round(scanCanvas.width*video.videoHeight/video.videoWidth);scanCtx.drawImage(video,0,0,scanCanvas.width,scanCanvas.height);const image=scanCtx.getImageData(0,0,scanCanvas.width,scanCanvas.height),code=qrLibrary(image.data,image.width,image.height,{inversionAttempts:'attemptBoth'});if(code){const id=tagId(code.data);if(id>=1&&id<=10){const pts=[code.location.topLeftCorner,code.location.topRightCorner,code.location.bottomLeftCorner,code.location.bottomRightCorner],xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x=Math.min(...xs)*video.videoWidth/scanCanvas.width,y=Math.min(...ys)*video.videoHeight/scanCanvas.height,w=(Math.max(...xs)-Math.min(...xs))*video.videoWidth/scanCanvas.width,h=(Math.max(...ys)-Math.min(...ys))*video.videoHeight/scanCanvas.height;return{id,box:{x,y,width:w,height:h}}}}return null}
async function scan(){if(!scanning)return;if(video.readyState>=2){try{const found=await decodeFrame();if(found){await showTag(found.id,found.box);$('reticle').style.opacity='.08'}else if(performance.now()-lastSeen>700){currentId=0;if(currentObject)currentObject.visible=false;setStatus('Procurando QR Code…');$('hint').innerHTML='Aponte para um QR Code AR-01 a AR-10.<br>O objeto 3D aparecerá sobre o marcador.';$('reticle').style.opacity='.5'}}catch(e){console.warn('Falha na leitura do QR',e)}}scanFrame=requestAnimationFrame(scan)}
async function startCamera(){if(stream)return;const button=$('startButton');button.disabled=true;button.textContent='Abrindo câmera…';setStatus('Solicitando acesso à câmera…');try{if(!window.isSecureContext)throw new Error('Este endereço não é seguro para usar a câmera. Abra o site publicado no Vercel com HTTPS.');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Este navegador não permite acesso à câmera. Abra o link no Chrome atualizado do Android.');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();$('permission').classList.add('hidden');setStatus('Câmera ativa · preparando leitor');scanning=true;scanFrame=requestAnimationFrame(scan);await setup3D();if(!('BarcodeDetector'in window)){setStatus('Câmera ativa · preparando leitor QR');const ok=await loadQrFallback();if(!ok){setStatus('Câmera ativa · leitor QR indisponível');$('hint').textContent='A câmera funciona, mas não foi possível carregar o leitor QR. Verifique a conexão com a internet e recarregue.'}}else setStatus('Câmera ativa · procurando QR');try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}}catch(e){console.error('Erro ao iniciar câmera:',e);stream?.getTracks().forEach(t=>t.stop());stream=null;showError(e.name==='NotAllowedError'?'A permissão da câmera foi bloqueada. No Chrome, toque no ícone ao lado do endereço, abra Permissões do site e permita Câmera; depois toque em Abrir câmera.':e.name==='NotFoundError'?'Não foi encontrada uma câmera neste dispositivo.':e.message||'Não foi possível acessar a câmera. Verifique as permissões do navegador.')}finally{button.disabled=false;button.textContent='Abrir câmera'}}
function resize(){if(renderer&&camera3d){renderer.setSize(innerWidth,innerHeight,false);camera3d.aspect=innerWidth/innerHeight;camera3d.updateProjectionMatrix()}}
function animate(t){if(currentObject?.visible){currentObject.rotation.y+=.008;currentObject.position.y+=Math.sin(t*.0015)*.0008}if(renderer&&scene&&camera3d)renderer.render(scene,camera3d);requestAnimationFrame(animate)}
$('startButton').addEventListener('click',startCamera);window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);window.addEventListener('pagehide',()=>{scanning=false;if(scanFrame)cancelAnimationFrame(scanFrame);stream?.getTracks().forEach(t=>t.stop())});startCamera();
</script>
</body></html>
