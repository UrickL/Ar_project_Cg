<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="description" content="AR Tags — câmera em tela cheia com rastreamento ao vivo de QR Codes e objetos 3D.">
<title>AR Tags</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overscroll-behavior:none}.stage{position:fixed;inset:0;background:#05080d;overflow:hidden}.camera{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;background:#05080d}.three-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.42),transparent 22%,transparent 72%,rgba(0,0,0,.42))}.topline{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}.brand,.status{border:1px solid rgba(255,255,255,.18);background:rgba(5,10,18,.58);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;font-size:12px;box-shadow:0 5px 24px #0002}.brand{font-weight:800;letter-spacing:.08em}.status{color:#b9ffe0;max-width:68%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bottomline{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 18px);left:16px;right:16px;text-align:center;pointer-events:none}.hint{display:inline-block;padding:10px 14px;border-radius:14px;background:rgba(5,10,18,.58);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);font-size:12px;color:#e3eaf4;line-height:1.45}.permission{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;background:rgba(5,8,13,.92);text-align:center}.permission-card{max-width:340px}.permission h1{font-size:22px;margin:0 0 8px}.permission p{color:#b8c3d5;font-size:14px;line-height:1.5;margin:0 0 18px}.permission button{border:0;border-radius:14px;background:#8bffcb;color:#062018;font-size:16px;font-weight:800;padding:14px 20px;width:100%}.hidden{display:none!important}.reticle{position:absolute;left:50%;top:50%;width:72px;height:72px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.35);border-radius:18px;opacity:.5;pointer-events:none}.reticle:before,.reticle:after{content:"";position:absolute;background:#8bffcb;opacity:.9}.reticle:before{width:20px;height:2px;left:25px;top:34px}.reticle:after{height:20px;width:2px;left:34px;top:25px}@media (orientation:landscape){.bottomline{left:auto;width:42%;right:12px;bottom:14px}.topline{left:12px;right:12px}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Leitor de realidade aumentada em tela cheia">
  <video id="camera" class="camera" autoplay muted playsinline></video>
  <canvas id="threeLayer" class="three-layer"></canvas>
  <div class="shade"></div>
  <div class="reticle" id="reticle"></div>
  <div class="topline"><div class="brand">AR TAGS</div><div class="status" id="status" role="status">Iniciando câmera…</div></div>
  <div class="bottomline"><div class="hint" id="hint">Aponte para um QR Code AR-01 a AR-10.<br>O objeto 3D aparecerá sobre o marcador.</div></div>
  <section class="permission hidden" id="permission"><div class="permission-card"><h1>Ative a câmera</h1><p>Para rastrear os QR Codes em tempo real, permita o acesso à câmera. Abra este site por HTTPS no Chrome do Android.</p><button id="startButton">Abrir câmera</button></div></section>
</main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id);
const video=$('camera'), canvas=$('threeLayer');
const COLORS=[0x8bffcb,0x7dd3fc,0xf9a8d4,0xc4b5fd,0xfde68a,0x6ee7b7,0x93c5fd,0xfca5a5,0xa7f3d0,0xd8b4fe];
const models=Array.from({length:10},(_,i)=>({id:i+1,path:`assets/models/object-${String(i+1).padStart(2,'0')}.glb`,color:COLORS[i]}));
let stream=null,detector=null,scanFrame=0,lastSeen=0,currentId=0,currentObject=null,modelCache=new Map(),lastStatus='';
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();const camera3d=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,100);camera3d.position.set(0,0,3.2);
scene.add(new THREE.HemisphereLight(0xffffff,0x475569,2.2));const keyLight=new THREE.DirectionalLight(0xffffff,2.3);keyLight.position.set(1.5,2.5,3);scene.add(keyLight);
function setStatus(s){if(s!==lastStatus){$('status').textContent=s;lastStatus=s}}
function tagId(raw){const s=String(raw||'').trim();let m=s.match(/(?:AR\s*[-:]?\s*)(0?[1-9]|10)\b/i);if(!m)m=s.match(/(?:^|[/?#=&])(?:AR-?)?(0?[1-9]|10)(?:$|[/?#=&])/i);return m?Number(m[1]):0}
function placeholder(id){const g=new THREE.Group(),color=COLORS[id-1],mat=new THREE.MeshStandardMaterial({color,metalness:.38,roughness:.22,emissive:color,emissiveIntensity:.16});let mesh;switch(id%4){case 1:mesh=new THREE.Mesh(new THREE.IcosahedronGeometry(.36,1),mat);break;case 2:mesh=new THREE.Mesh(new THREE.TorusKnotGeometry(.27,.075,100,12),mat);break;case 3:mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.39,0),mat);break;default:mesh=new THREE.Mesh(new THREE.TorusGeometry(.3,.075,16,64),mat)}g.add(mesh);const ring=new THREE.Mesh(new THREE.TorusGeometry(.5,.012,8,64),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.8}));ring.rotation.x=Math.PI/2.6;g.add(ring);const orb=new THREE.Mesh(new THREE.SphereGeometry(.06,20,16),new THREE.MeshBasicMaterial({color:0xffffff}));orb.position.set(.48,.12,0);g.add(orb);g.userData.color=color;g.userData.placeholder=true;return g}
async function loadObject(id){if(modelCache.has(id))return modelCache.get(id).clone(true);let obj;try{const r=await fetch(models[id-1].path,{method:'HEAD',cache:'no-store'});if(r.ok){const gltf=await new GLTFLoader().loadAsync(models[id-1].path);obj=gltf.scene;const box=new THREE.Box3().setFromObject(obj),size=box.getSize(new THREE.Vector3()),max=Math.max(size.x,size.y,size.z)||1;obj.scale.setScalar(.72/max);const center=box.getCenter(new THREE.Vector3());obj.position.sub(center);}}catch(e){}if(!obj)obj=placeholder(id);modelCache.set(id,obj);return obj.clone(true)}
function screenPoint(box){const vw=video.videoWidth||innerWidth,vh=video.videoHeight||innerHeight;const sw=innerWidth,sh=innerHeight;const scale=Math.max(sw/vw,sh/vh),shownW=vw*scale,shownH=vh*scale;const cropX=(shownW-sw)/2,cropY=(shownH-sh)/2;const x=(box.x+box.width/2)*scale-cropX;const y=box.y*scale-cropY;return {x,y,w:box.width*scale,h:box.height*scale}}
async function showTag(id,box){lastSeen=performance.now();if(id!==currentId){currentId=id;setStatus(`QR AR-${String(id).padStart(2,'0')} detectado`);$('hint').innerHTML=`Marcador AR-${String(id).padStart(2,'0')} reconhecido.<br>Objeto 3D em realidade aumentada`;const next=await loadObject(id);if(id!==currentId)return;if(currentObject)scene.remove(currentObject);currentObject=next;scene.add(currentObject)}if(currentObject&&box){const p=screenPoint(box);const nx=(p.x/innerWidth)*2-1;const ny=1-(p.y/innerHeight)*2;const z=1.35;const v=new THREE.Vector3(nx,ny,0.5).unproject(camera3d);const dir=v.sub(camera3d.position).normalize();const distance=z/Math.max(.1,Math.abs(dir.z));const world=camera3d.position.clone().add(dir.multiplyScalar(distance));world.y+=Math.min(.75,p.h/innerHeight*1.8);currentObject.position.lerp(world,.4);const size=Math.max(.45,Math.min(1.25,p.w/innerWidth*2.8));currentObject.scale.setScalar(currentObject.userData.placeholder?size:currentObject.scale.x);currentObject.visible=true}}
async function scan(){if(!stream||video.readyState<2){scanFrame=requestAnimationFrame(scan);return}try{const codes=await detector.detect(video);let found=null;for(const code of codes){const id=tagId(code.rawValue);if(id>=1&&id<=10){found={id,box:code.boundingBox};break}}if(found){await showTag(found.id,found.box);$('reticle').style.opacity='.08'}else if(performance.now()-lastSeen>650){currentId=0;if(currentObject)currentObject.visible=false;setStatus('Procurando QR Code…');$('hint').innerHTML='Aponte para um QR Code AR-01 a AR-10.<br>O objeto 3D aparecerá sobre o marcador.';$('reticle').style.opacity='.5'}}catch(e){}scanFrame=requestAnimationFrame(scan)}
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('A câmera exige HTTPS e um navegador compatível.');if(!('BarcodeDetector'in window))throw new Error('Este navegador não oferece leitura QR nativa. Tente Chrome atualizado no Android.');detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();$('permission').classList.add('hidden');setStatus('Câmera ativa · procurando QR');scanFrame=requestAnimationFrame(scan);try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}}catch(e){$('permission').classList.remove('hidden');setStatus('Câmera indisponível');$('permission').querySelector('p').textContent=e.message||'Não foi possível acessar a câmera. Verifique a permissão e tente novamente.'}}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera3d.aspect=innerWidth/innerHeight;camera3d.updateProjectionMatrix()}
function animate(t){if(currentObject?.visible){currentObject.rotation.y+=.008;currentObject.position.y+=Math.sin(t*.0015)*.0008}renderer.render(scene,camera3d);requestAnimationFrame(animate)}
$('startButton').addEventListener('click',startCamera);window.addEventListener('resize',resize);window.addEventListener('orientationchange',resize);window.addEventListener('pagehide',()=>{if(scanFrame)cancelAnimationFrame(scanFrame);stream?.getTracks().forEach(t=>t.stop())});requestAnimationFrame(animate);startCamera();
</script>
</body></html>
